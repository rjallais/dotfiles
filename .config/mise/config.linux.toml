[bootstrap.hooks]
post-dotfiles = { run = "systemctl --user daemon-reload || echo 'Warning: systemctl --user daemon-reload failed; run it from your active user session to load updated units.' >&2" }

[tasks.brew-ublue]
description = "Install Universal Blue tap casks (custom cask DSL not handled by mise's native cask driver)"
run = """
if ! command -v brew >/dev/null 2>&1; then
    echo "Homebrew not found; skipping ublue-os/tap casks"
    exit 0
fi
brew tap ublue-os/tap
brew install --cask \
    ublue-os/tap/antigravity-ide-linux \
    ublue-os/tap/antigravity-linux \
    ublue-os/tap/aurora-wallpapers \
    ublue-os/tap/bazzite-wallpapers \
    ublue-os/tap/bluefin-wallpapers \
    ublue-os/tap/bluefin-wallpapers-extra \
    ublue-os/tap/framework-wallpapers
"""
