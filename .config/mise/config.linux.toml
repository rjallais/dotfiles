# Linux (Bazzite / Fedora Atomic) Mise bootstrap configuration

[dotfiles]
"~/.config/ghostty/config" = { source = "../../dotfiles/.config/ghostty/config" }
"~/.config/ghostty/config.ghostty" = { source = "../../dotfiles/.config/ghostty/config.ghostty" }
"~/.config/zed/settings.json" = { source = "../../dotfiles/.config/zed/settings.json" }
"~/.config/bluefin-cli/config.yaml" = { source = "../../dotfiles/.config/bluefin-cli/config.yaml" }
"~/.config/bluefin-cli/shell.json" = { source = "../../dotfiles/.config/bluefin-cli/shell.json" }
"~/.homebrew/brew.env" = { source = "../../dotfiles/.config/brew.env" }
"~/.config/homebrew/brew.env" = { source = "../../dotfiles/.config/brew.env" }
"~/.config/environment.d/10-local-bin.conf" = { source = "../../dotfiles/.config/environment.d/10-local-bin.conf" }
"~/.config/environment.d/blur-my-shell.conf" = { source = "../../dotfiles/.config/environment.d/blur-my-shell.conf" }
"~/.config/environment.d/intel-gtk-fix.conf" = { source = "../../dotfiles/.config/environment.d/intel-gtk-fix.conf" }
"~/.config/systemd/user/syncthing.service" = { source = "../../dotfiles/.config/systemd/user/syncthing.service" }
"~/.config/systemd/user/syncthing.service.d/override-exec.conf" = { source = "../../dotfiles/.config/systemd/user/syncthing.service.d/override-exec.conf" }
"~/.config/systemd/user/syncthing.service.d/restart.conf" = { source = "../../dotfiles/.config/systemd/user/syncthing.service.d/restart.conf" }
"~/.config/systemd/user/zen-filter.service" = { source = "../../dotfiles/.config/systemd/user/zen-filter.service" }

[bootstrap.files."/etc/sysexts-manager/google-chrome.conf"]
source = "../../system/etc/sysexts-manager/google-chrome.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sysexts-manager/incus.conf"]
source = "../../system/etc/sysexts-manager/incus.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sysexts-manager/netbird.conf"]
source = "../../system/etc/sysexts-manager/netbird.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sysupdate.docker-ce.d/docker-ce.conf"]
source = "../../system/etc/sysupdate.docker-ce.d/docker-ce.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.brew.taps]
"hashicorp/tap" = "https://github.com/hashicorp/homebrew-tap.git"
"ublue-os/tap" = "https://github.com/ublue-os/homebrew-tap.git"
"ublue-os/experimental-tap" = "https://github.com/ublue-os/homebrew-experimental-tap.git"

