# Windows Mise bootstrap configuration

[dotfiles]
"~/AppData/Roaming/nushell/config.nu" = { source = "../../dotfiles/AppData/Roaming/nushell/config.nu" }
"~/AppData/Roaming/nushell/env.nu" = { source = "../../dotfiles/AppData/Roaming/nushell/env.nu" }

[bootstrap.packages]
"winget:Nushell.Nushell" = "latest"
"winget:JetBrains.NerdFonts.JetBrainsMono" = "latest"

[bootstrap.hooks]
post-tools = { run = "mise run nu-autoload" }

[tasks.nu-autoload]
description = "Generate Nushell vendor/autoload integration scripts on Windows"
run = 'mise exec aqua:nushell/nushell -- nu "{{ config_root }}\scripts\nu-autoload.nu"'
