[settings]
experimental = true
aqua.github_attestations = false
idiomatic_version_file_enable_tools = []
minimum_release_age = "0s"

[settings.npm]
package_manager = "aube"

[settings.cargo]
binstall = true

[settings.python]
compile = false

[settings.ruby]
compile = false

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
